models:
  - model_id: mock.default
    provider_name: mock
    model_name: mock-echo
    temperature: 0
    max_tokens: 512
    timeout: 10
    retry:
      max_attempts: 1
      initial_delay_seconds: 0.5
      max_delay_seconds: 1
      backoff_multiplier: 1
      jitter_ratio: 0
    rate_limits:
      max_concurrency: 100
    provider_kwargs:
      prefix: "[MOCK]"
  - model_id: mock.judge
    provider_name: mock
    model_name: mock-judge
    temperature: 0
    max_tokens: 512
    timeout: 10
    retry:
      max_attempts: 1
      initial_delay_seconds: 0.5
      max_delay_seconds: 1
      backoff_multiplier: 1
      jitter_ratio: 0
    rate_limits:
      max_concurrency: 100
    provider_kwargs:
      mode: judge_json
  - model_id: openai.default
    provider_name: openai_compatible
    model_name: gpt-4.1-mini
    api_base: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 1024
    timeout: 60
    retry:
      max_attempts: 3
      initial_delay_seconds: 1
      max_delay_seconds: 20
      backoff_multiplier: 2
      jitter_ratio: 0.2
    rate_limits:
      max_concurrency: 100
    supports_system_prompt: true
    supports_stream: false
    supports_reasoning: true
    provider_kwargs: {}
